<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0b0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="S4 Trading">
<title>S4 Trading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0b0a;--card:#121412;--raise:#181b17;--line:#1e211d;--txt:#f2f4ef;--mut:#8a9086;--dim:#5f655c;--lime:#c5f36b;--lime2:#8fb84a;--lime3:#4f6a22;--lime4:#2c3a17;--red:#ff7a6b;--redbg:#2e1513;--upbg:#1f2a12;--amber:#f0c75e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,-apple-system,system-ui,sans-serif;font-size:14px}
.n{font-variant-numeric:tabular-nums}
.hide{display:none!important}
.wrap{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 100px)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.top h1{font-size:20px;margin:0;font-weight:700}
.sub{font-size:12px;color:var(--mut)}
.live{font-size:11px;color:var(--mut);display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;padding:6px 10px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim)}.dot.on{background:var(--lime)}.dot.off{background:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lbl{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:1.2px;font-weight:500}
.big{font-size:26px;font-weight:600;margin-top:10px}
.up{background:var(--upbg);color:var(--lime);font-size:11px;font-weight:600;padding:3px 7px;border-radius:7px;white-space:nowrap}
.dn{background:var(--redbg);color:var(--red);font-size:11px;font-weight:600;padding:3px 7px;border-radius:7px;white-space:nowrap}
.nt{background:var(--raise);color:var(--mut);font-size:11px;font-weight:600;padding:3px 7px;border-radius:7px;white-space:nowrap}
.wn{background:#2e2410;color:var(--amber);font-size:11px;font-weight:600;padding:3px 8px;border-radius:7px;white-space:nowrap}
.go{width:26px;height:26px;border-radius:50%;background:var(--lime);color:var(--bg);display:flex;align-items:center;justify-content:center;flex:none}
.go.r{background:var(--redbg);color:var(--red)}
.tile{background:var(--raise);border-radius:12px;padding:10px}
.tile .k{font-size:11px;color:var(--mut);display:flex;align-items:center;gap:6px}
.tile .v{font-weight:600;margin-top:3px}
.sq{width:7px;height:7px;border-radius:2px;background:var(--lime);display:inline-block}
.fl{display:flex;flex-direction:column;gap:5px;font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:1px}
select,input{height:44px;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--txt);font:600 14px Inter,sans-serif;padding:0 11px;width:100%;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,#8a9086 50%),linear-gradient(135deg,#8a9086 50%,transparent 50%);background-position:calc(100% - 16px) 19px,calc(100% - 11px) 19px;background-size:5px 5px;background-repeat:no-repeat;padding-right:26px}
input{background:var(--bg);font-variant-numeric:tabular-nums;text-transform:none;letter-spacing:0}
button{font-family:Inter,sans-serif;cursor:pointer}
.pri{height:48px;border:0;border-radius:12px;background:var(--lime);color:var(--bg);font-weight:700;font-size:14px;width:100%}
.btn{height:44px;border-radius:11px;font-weight:600;font-size:13px;border:1px solid var(--line);background:var(--raise);color:var(--txt);width:100%}
.btn.red{color:var(--red)}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;height:36px;border:0;border-radius:8px;background:transparent;color:var(--mut);font-size:13px;font-weight:500}
.seg button.on{background:var(--lime);color:var(--bg);font-weight:700}
.bars{height:140px;display:flex;align-items:flex-end;gap:4px;margin-top:14px}
.bar{flex:1;min-width:3px;border-radius:6px;background:repeating-linear-gradient(135deg,#1c1f1b 0 4px,#252923 4px 8px);position:relative}
.bar .cap{position:absolute;top:4px;left:22%;right:22%;height:3px;border-radius:2px;background:var(--lime)}
.bar.neg .cap{background:var(--red)}
.bar.hl{background:var(--lime)}.bar.hl .cap{display:none}.bar.hl.neg{background:var(--red)}
.xl{display:flex;gap:4px;font-size:10px;color:var(--mut);margin-top:6px;text-align:center}.xl span{flex:1;min-width:3px;overflow:visible;white-space:nowrap}
.insight{background:var(--lime);border-radius:16px;padding:16px;color:var(--bg)}
.insight .tag{display:inline-flex;background:var(--bg);color:var(--lime);font-size:11px;font-weight:600;padding:5px 10px;border-radius:20px}
.insight .t{font-size:17px;font-weight:600;line-height:1.38;margin-top:10px}
.insight .pill{border:1.5px solid var(--bg);border-radius:14px;padding:0 7px}
.row{background:var(--raise);border-radius:12px;padding:12px}
.rowh{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer;width:100%;background:none;border:0;color:var(--txt);padding:0;font-size:14px;font-weight:600;text-align:left}
.lnk{color:var(--lime);font-weight:600;font-size:13px;background:none;border:0;padding:8px 0 0}
.hm{display:grid;grid-template-columns:30px repeat(12,minmax(0,1fr));gap:3px;font-size:10px;color:var(--mut);align-items:center;margin-top:12px}
.hm i{height:14px;border-radius:3px;display:block}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;font-size:10px;text-align:center}
.cal button{height:40px;border-radius:8px;border:0;background:var(--raise);color:var(--dim);font-size:10px;padding:3px 0;font-family:Inter,sans-serif}
.tr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.tr:last-child{border-bottom:0}
.tr .a{font-size:13px;font-weight:600}.tr .b{font-size:11px;color:var(--mut);margin-top:2px}
.ack{font-size:12px;color:var(--lime);min-height:16px}
.foot{font-size:11px;color:var(--dim);text-align:center;line-height:1.5}
.nav{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 10px);max-width:496px;margin:0 auto;height:64px;background:var(--card);border:1px solid var(--line);border-radius:20px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:6px;gap:6px;z-index:10}
.nav button{border:0;background:transparent;color:var(--mut);border-radius:14px;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.nav button.on{background:var(--lime);color:var(--bg);font-weight:700}
.banner{background:#2e2410;color:var(--amber);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:10px}
.center{max-width:380px;margin:60px auto;padding:0 16px}
.err{color:var(--red);font-size:13px;min-height:16px}
.empty{color:var(--mut);font-size:13px;padding:6px 0}
</style>
</head>
<body>

<section id="cfgView" class="center hide">
  <div class="card stack">
    <div style="display:flex;align-items:center;gap:10px"><div class="go" style="width:34px;height:34px;border-radius:10px;font-weight:700">S4</div><b>Connect to Firebase</b></div>
    <label class="fl">Web API key<input id="cfgKey" autocomplete="off"></label>
    <label class="fl">Project ID<input id="cfgProj" autocomplete="off"></label>
    <label class="fl">Realtime Database URL<input id="cfgUrl" autocomplete="off" placeholder="https://....firebasedatabase.app"></label>
    <button id="cfgSave" class="pri">Save</button>
    <div class="sub">Saved on this device only.</div>
  </div>
</section>

<section id="loginView" class="center hide">
  <div class="card stack">
    <div style="display:flex;align-items:center;gap:10px"><div class="go" style="width:34px;height:34px;border-radius:10px;font-weight:700">S4</div><b>Sign in</b></div>
    <label class="fl">Email<input id="email" type="email" autocomplete="username"></label>
    <label class="fl">Password<input id="pass" type="password" autocomplete="current-password"></label>
    <button id="loginBtn" class="pri">Sign in</button>
    <div id="loginErr" class="err"></div>
    <button id="cfgReset" class="btn">Change Firebase project</button>
  </div>
</section>

<main id="appView" class="wrap hide">
  <div class="top">
    <div><h1 id="pgTitle">Overview</h1><div class="sub" id="pgSub">S4 bot performance &amp; progress</div></div>
    <span class="live"><span id="liveDot" class="dot"></span><span id="liveTxt">-</span></span>
  </div>
  <div id="banner" class="banner hide"></div>
  <label class="fl" style="margin-bottom:12px">MT5 account<select id="accSel"></select></label>

  <!-- SUMMARY -->
  <section id="pSum" class="stack">
    <div class="g2">
      <label class="fl">View<select id="sType"><option value="D">Daily</option><option value="W">Weekly</option><option value="M">Monthly</option></select></label>
      <label class="fl">Period<select id="sPer"></select></label>
    </div>
    <div id="sBody" class="stack"></div>
  </section>

  <!-- CURRENCIES -->
  <section id="pCur" class="stack hide">
    <div style="display:grid;grid-template-columns:1.1fr 1fr 1.2fr;gap:8px">
      <label class="fl">Currency<select id="cSym"></select></label>
      <label class="fl">View<select id="cType"><option value="D">Daily</option><option value="W">Weekly</option><option value="M">Monthly</option></select></label>
      <label class="fl">Period<select id="cPer"></select></label>
    </div>
    <div id="cBody" class="stack"></div>
  </section>

  <!-- CONTROL -->
  <section id="pCtl" class="stack hide"></section>
</main>

<nav id="nav" class="nav hide">
  <button data-tab="sum" class="on"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Summary</button>
  <button data-tab="cur"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg>Currencies</button>
  <button data-tab="ctl"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Control</button>
</nav>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, onValue, update, query, limitToLast } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const FIXED_CONFIG = { apiKey: "", projectId: "", databaseURL: "" };   // optional: fill to skip the first-run form

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const show = (id, on) => $(id).classList.toggle("hide", !on);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const nowS = () => Date.now() / 1000;
const H8 = 8 * 3600, DAY = 86400;
const money = v => (v == null || isNaN(v)) ? "-" : (v < 0 ? "−$" : (v > 0 ? "+$" : "$")) + Math.abs(v).toLocaleString("en-US", {minimumFractionDigits:2, maximumFractionDigits:2});
const cash = v => (v == null || isNaN(v)) ? "-" : "$" + Number(v).toLocaleString("en-US", {minimumFractionDigits:2, maximumFractionDigits:2});
const badge = (v, txt) => `<span class="${v > 0 ? "up" : v < 0 ? "dn" : "nt"}">${v > 0 ? "▲ " : v < 0 ? "▼ " : ""}${txt}</span>`;
const pct = v => (v == null || !isFinite(v)) ? "-" : (Math.abs(v) < 10 ? v.toFixed(1) : Math.round(v)) + "%";
const mytParts = t => { const d = new Date((t + H8) * 1000); return { y: d.getUTCFullYear(), m: d.getUTCMonth(), d: d.getUTCDate(), h: d.getUTCHours(), mi: d.getUTCMinutes(), wd: (d.getUTCDay() + 6) % 7 }; };
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const WD = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const fmtT = t => { const p = mytParts(t); return `${p.d} ${MON[p.m]} ${String(p.h).padStart(2,"0")}:${String(p.mi).padStart(2,"0")}`; };
const fmtHM = t => { const p = mytParts(t); return `${String(p.h).padStart(2,"0")}:${String(p.mi).padStart(2,"0")}`; };
const dayStart = t => Math.floor((t + H8) / DAY) * DAY - H8;
const weekStart = t => { const d = Math.floor((t + H8) / DAY); return (d - (d + 3) % 7) * DAY - H8; };
const monthStart = (y, m) => Date.UTC(y, m, 1) / 1000 - H8;
const ago = t => { const s = Math.max(0, Math.round(nowS() - t)); return s < 60 ? s + "s ago" : s < 3600 ? Math.round(s/60) + "m ago" : Math.round(s/3600) + "h ago"; };
const ICON_UP = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg>';
const ICON_DN = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M7 7l10 10M17 9v8H9"/></svg>';
const SKIP_TXT = { quiet: "Market too quiet (ATR)", spread: "Spread too wide", news: "News blackout", lot: "Min lot would exceed risk", margin: "Not enough margin", maxopen: "Max open trades reached", limit: "Daily/weekly loss stop" };
const SHADES = ["#c5f36b", "#8fb84a", "#5f7f2c", "#3e5320", "#2a2e28", "#a6d65a"];

/* periods: type D/W/M -> list of {v, label, s, e} (Malaysia time) */
function periods(type, trades) {
  const now = nowS(), out = [];
  const first = trades.length ? Math.min(...trades.map(t => t.t)) : now;
  if (type === "D") {
    const n = Math.max(14, Math.min(120, Math.ceil((now - first) / DAY) + 1));
    for (let i = 0; i < n; i++) { const s = dayStart(now) - i * DAY; const p = mytParts(s + 1); out.push({ v: String(s), s, e: s + DAY, label: (i === 0 ? "Today · " : i === 1 ? "Yesterday · " : "") + `${WD[p.wd]}, ${p.d} ${MON[p.m]} ${p.y}` }); }
  } else if (type === "W") {
    const n = Math.max(8, Math.min(52, Math.ceil((now - first) / (7 * DAY)) + 1));
    for (let i = 0; i < n; i++) { const s = weekStart(now) - i * 7 * DAY; const a = mytParts(s + 1), b = mytParts(s + 6 * DAY + 1); out.push({ v: String(s), s, e: s + 7 * DAY, label: (i === 0 ? "This week · " : "") + `${a.d} ${MON[a.m]} – ${b.d} ${MON[b.m]}` }); }
  } else {
    const p = mytParts(now), f = mytParts(first);
    let y = p.y, m = p.m, k = 0;
    while (k < 24) { const s = monthStart(y, m); out.push({ v: String(s), s, e: monthStart(m === 11 ? y + 1 : y, (m + 1) % 12), label: `${MON[m]} ${y}` }); if ((y < f.y || (y === f.y && m <= f.m)) && k >= 2) break; m--; if (m < 0) { m = 11; y--; } k++; }
  }
  return out;
}
function fillPeriods(selId, type, trades, keep) {
  const list = periods(type, trades), sel = $(selId);
  sel.innerHTML = list.map(p => `<option value="${p.v}">${esc(p.label)}</option>`).join("");
  sel.value = (keep && list.some(p => p.v === keep)) ? keep : list[0].v;
  return list;
}
function stats(list) {
  const w = list.filter(t => t.profit > 0), l = list.filter(t => t.profit <= 0);
  const gp = w.reduce((s, t) => s + t.profit, 0), gl = -l.reduce((s, t) => s + t.profit, 0);
  return { n: list.length, w: w.length, net: gp - gl, gp, gl, pf: gl > 0 ? gp / gl : (gp > 0 ? Infinity : 0),
           wr: list.length ? 100 * w.length / list.length : 0, aw: w.length ? gp / w.length : 0, al: l.length ? -gl / l.length : 0,
           best: list.length ? Math.max(...list.map(t => t.profit)) : 0, worst: list.length ? Math.min(...list.map(t => t.profit)) : 0,
           hold: list.length ? list.reduce((s, t) => s + Math.max(0, t.t - (t.o || t.t)), 0) / list.length : 0 };
}
const pfTxt = pf => pf === Infinity ? "∞" : pf.toFixed(2);
const holdTxt = s => s < 3600 ? Math.round(s / 60) + "m" : (s / 3600).toFixed(1) + "h";

/* ---------- boot ---------- */
function loadCfg() {
  if (FIXED_CONFIG.apiKey && FIXED_CONFIG.databaseURL) return FIXED_CONFIG;
  try { return JSON.parse(localStorage.getItem("s4cfg") || "null"); } catch { return null; }
}
function boot() {
const cfg = loadCfg();
if (!cfg) {
  show("cfgView", true);
  $("cfgSave").onclick = () => {
    const c = { apiKey: $("cfgKey").value.trim(), projectId: $("cfgProj").value.trim(), databaseURL: $("cfgUrl").value.trim().replace(/\/+$/, "") };
    if (!c.apiKey || !c.projectId || !c.databaseURL.startsWith("https://")) { alert("Fill in all three fields. The database URL starts with https://"); return; }
    try { localStorage.setItem("s4cfg", JSON.stringify(c)); } catch {}
    location.reload();
  };
} else start(cfg);
}

/* ---------- app state ---------- */
const S = { acc: null, base: null, index: {}, account: null, symbols: {}, trades: [], equity: [], skips: {}, control: {}, ack: null,
            tab: "sum", sType: "D", sPer: null, cSym: "ALL", cType: "M", cPer: null, open: {}, ctlOpen: null, ctlDirty: true };
let db, subs = [];

function start(c) {
  const app = initializeApp({ apiKey: c.apiKey, authDomain: c.projectId + ".firebaseapp.com", projectId: c.projectId, databaseURL: c.databaseURL });
  const auth = getAuth(app); db = getDatabase(app);
  setPersistence(auth, browserLocalPersistence).catch(() => {});
  $("cfgReset").onclick = () => { try { localStorage.removeItem("s4cfg"); } catch {} location.reload(); };
  $("loginBtn").onclick = async () => {
    $("loginErr").textContent = "";
    try { await signInWithEmailAndPassword(auth, $("email").value.trim(), $("pass").value); }
    catch (e) { $("loginErr").textContent = "Sign-in failed: " + (e.code || e.message); }
  };
  $("pass").addEventListener("keydown", e => { if (e.key === "Enter") $("loginBtn").click(); });
  let unIdx = null;
  onAuthStateChanged(auth, user => {
    show("loginView", !user); show("appView", !!user); show("nav", !!user);
    if (unIdx) { unIdx(); unIdx = null; }
    unwire();
    if (!user) return;
    unIdx = onValue(ref(db, "s4/index"), snap => {
      S.index = snap.val() || {};
      const list = Object.values(S.index).filter(a => a && a.login).sort((a, b) => (b.ts || 0) - (a.ts || 0));
      if (!list.length) { $("accSel").innerHTML = "<option>Waiting for the EA…</option>"; return; }
      let saved = null; try { saved = localStorage.getItem("s4acc"); } catch {}
      const want = S.acc || (S.index[saved] ? saved : list[0].login);
      $("accSel").innerHTML = list.map(a => `<option value="${esc(a.login)}">${esc(a.type)} · ${esc(a.login)} · ${esc(a.server)}</option>`).join("");
      $("accSel").value = want;
      if (want !== S.acc) pickAcc(want);
    }, err => banner("Cannot read the data (" + (err.code || err.message) + "). Check that the UID in Realtime Database → Rules matches your user's UID, then Publish."));
  });
  $("accSel").onchange = e => pickAcc(e.target.value);
  document.querySelectorAll(".nav button").forEach(b => b.onclick = () => setTab(b.dataset.tab));
  $("sType").onchange = e => { S.sType = e.target.value; S.sPer = null; renderSum(); };
  $("sPer").onchange = e => { S.sPer = e.target.value; renderSum(); };
  $("cSym").onchange = e => { S.cSym = e.target.value; renderCur(); };
  $("cType").onchange = e => { S.cType = e.target.value; S.cPer = null; renderCur(); };
  $("cPer").onchange = e => { S.cPer = e.target.value; renderCur(); };
  setInterval(() => { renderLive(); }, 5000);
}
function banner(msg) { $("banner").textContent = msg || ""; show("banner", !!msg); }
function unwire() { subs.forEach(f => f()); subs = []; }
function pickAcc(acc) {
  S.acc = acc; S.base = "s4/acc/" + acc; try { localStorage.setItem("s4acc", acc); } catch {}
  Object.assign(S, { account: null, symbols: {}, trades: [], equity: [], skips: {}, control: {}, ack: null, open: {}, ctlDirty: true });
  unwire();
  const on = (path, cb) => subs.push(onValue(ref(db, S.base + path), s => cb(s.val()), err => banner("Read error: " + err.message)));

  tr.forEach(t => { const p = mytParts(t.o || t.t); grid[p.wd][Math.floor(p.h / 2)]++; const k = p.wd + "|" + p.h; pnl[k] = (pnl[k] || 0) + t.profit; });
  const mx = Math.max(1, ...grid.flat());
  const col = v => v === 0 ? "#181b17" : ["#2c3a17", "#4f6a22", "#8fb84a", "#c5f36b"][Math.min(3, Math.floor((v / mx) * 3.999))];
  let rows = `<span></span>` + Array.from({ length: 12 }, (_, i) => `<span>${i % 3 === 0 ? String(i * 2).padStart(2, "0") : ""}</span>`).join("");
  grid.forEach((r, d) => { rows += `<span>${WD[d]}</span>` + r.map(v => `<i style="background:${col(v)}" title="${v}"></i>`).join(""); });
  const ent = Object.entries(pnl).sort((a, b) => b[1] - a[1]);
  const lab = k => { const [d, h] = k.split("|"); return `${WD[d]} ${String(h).padStart(2, "0")}:00`; };
  const late = tr.length ? Math.round(100 * tr.filter(t => mytParts(t.o || t.t).h >= 20).length / tr.length) : 0;
  return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><span style="font-weight:600">Trades by weekday &amp; hour</span><span style="display:flex;align-items:center;gap:3px;font-size:10px;color:var(--mut)">Low <i style="width:9px;height:9px;border-radius:2px;background:#2c3a17;display:inline-block"></i><i style="width:9px;height:9px;border-radius:2px;background:#4f6a22;display:inline-block"></i><i style="width:9px;height:9px;border-radius:2px;background:#8fb84a;display:inline-block"></i><i style="width:9px;height:9px;border-radius:2px;background:#c5f36b;display:inline-block"></i> High</span></div>
    <div class="hm">${rows}</div>
    <div class="g3 tile" style="margin-top:12px;font-size:11px;color:var(--mut)">
      <div>Best hour<div style="color:var(--txt);font-weight:700;font-size:13px">${ent.length && ent[0][1] > 0 ? lab(ent[0][0]) : "-"}</div></div>
      <div>Worst hour<div style="color:var(--txt);font-weight:700;font-size:13px">${ent.length && ent[ent.length - 1][1] < 0 ? lab(ent[ent.length - 1][0]) : "-"}</div></div>
      <div>After 20:00<div style="color:var(--txt);font-weight:700;font-size:13px">${tr.length ? late + "%" : "-"}</div></div>
    </div></div>`;
}
function calendar(mine, P) {
  const p = mytParts(P.s + 1), ms = monthStart(p.y, p.m), me = monthStart(p.m === 11 ? p.y + 1 : p.y, (p.m + 1) % 12);
  const lead = mytParts(ms + 1).wd, today = dayStart(nowS());
  let cells = "";
  for (let i = 0; i < lead; i++) cells += `<span></span>`;
  for (let s = ms; s < me; s += DAY) {
    const v = mine.filter(t => t.t >= s && t.t < s + DAY), sum = v.reduce((a, t) => a + t.profit, 0), d = mytParts(s + 1).d;
    const sel = S.cType === "D" && String(s) === S.cPer;
    const style = !v.length ? "" : sum > 0 ? (sel ? "background:#c5f36b;color:#0a0b0a;font-weight:700" : "background:#2c3a17;color:#c5f36b") : (sel ? "background:#ff7a6b;color:#0a0b0a;font-weight:700" : "background:#2e1513;color:#ff7a6b");
    cells += `<button data-day="${s}" style="${style}${s === today && !sel ? ";outline:1px solid #5f655c" : ""}${sel && !v.length ? ";outline:1.5px solid #c5f36b" : ""}">${d}${v.length ? `<div class="n" style="font-weight:700">${sum > 0 ? "+" : ""}${sum.toFixed(1)}</div>` : ""}</button>`;
  }
  return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><span style="font-weight:600">Daily P/L · ${MON[p.m]} ${p.y}</span><span class="lbl">Tap a day</span></div>
    <div class="cal" style="color:var(--mut);margin:12px 0 4px">${WD.map(w => `<span>${w[0]}</span>`).join("")}</div><div class="cal">${cells}</div></div>`;
}
function skipsCard(P) {
  const tot = {};
  const keys = S.cSym === "ALL" ? Object.keys(S.skips) : [S.cSym];
  keys.forEach(k => { const byDay = S.skips[k] || {}; Object.entries(byDay).forEach(([day, obj]) => {
    const s = Date.UTC(+day.slice(0, 4), +day.slice(4, 6) - 1, +day.slice(6, 8)) / 1000 - H8;
    if (s >= P.s && s < P.e) Object.entries(obj || {}).forEach(([r, n]) => tot[r] = (tot[r] || 0) + (n || 0)); }); });
  const arr = Object.entries(tot).filter(e => e[1] > 0).sort((a, b) => b[1] - a[1]);
  const cols = ["#c5f36b", "#8fb84a", "#4f6a22", "#3e5320", "#2a2e28", "#2a2e28", "#2a2e28"];
  return `<div class="card"><div style="font-weight:600;margin-bottom:10px">Why it didn't trade <span class="sub" style="font-weight:400">· signals skipped</span></div>
    ${arr.length ? `<div class="stack" style="gap:8px">${arr.map(([r, n], i) => `<div class="tile" style="display:flex;justify-content:space-between;font-size:13px"><span style="display:flex;align-items:center;gap:7px"><span class="sq" style="background:${cols[i]}"></span>${esc(SKIP_TXT[r] || r)}</span><b class="n">${n}</b></div>`).join("")}</div>` : `<div class="empty">No skipped signals recorded in this period.</div>`}</div>`;
}

/* ---------- CONTROL ---------- */
function renderCtl() {
  if (!S.ctlDirty) { updCtlBadges(); return; }
  S.ctlDirty = false;
  const c = S.control || {}, a = S.account || {}, keys = Object.keys(S.symbols).sort();
  if (S.ctlOpen == null && keys.length) S.ctlOpen = keys[0];
  const paused = !!(a.paused ?? c.pause);
  let h = `<div class="card stack" style="gap:12px">
      <div style="display:flex;justify-content:space-between;align-items:center"><span class="lbl">All currencies</span><span id="allBadge">${paused ? '<span class="wn">■ STOPPED</span>' : '<span class="up">● RUNNING</span>'}</span></div>
      <div class="g2"><button class="btn red" id="stopAll" style="height:50px;background:#1a0f0e;border-color:#3a1c19">■ Stop all</button><button class="pri" id="startAll" style="height:50px">▶ Start all</button></div>
      <button class="btn" id="resetAll">↺ Reset daily/weekly stop · all</button>
      <button class="btn red" id="closeAll">✕ Close all open trades</button>
    </div>
    <div class="card stack" style="gap:12px">
      <span class="lbl">Account limits</span>
      <div class="g3">
        <label class="fl">Daily stop %<input id="aDaily" type="number" inputmode="decimal" step="0.5" value="${c.dailyPct ?? a.dailyPct ?? ""}"></label>
        <label class="fl">Weekly stop %<input id="aWeekly" type="number" inputmode="decimal" step="0.5" value="${c.weeklyPct ?? a.weeklyPct ?? ""}"></label>
        <label class="fl">Max open (all)<input id="aMax" type="number" inputmode="numeric" step="1" value="${c.maxOpenAll ?? 6}"></label>
      </div>
      <span class="lbl" style="margin-top:4px">Set every currency at once</span>
      <div class="g2">
        <label class="fl">Risk per trade %<input id="aRisk" type="number" inputmode="decimal" step="0.1" value="${c.riskPct ?? a.riskPct ?? ""}"></label>
        <div class="fl">Max open per currency<div class="seg" id="aMO">${[1,2,3].map(n => `<button data-v="${n}">${n}</button>`).join("")}</div></div>
      </div>
      <button class="pri" id="applyAll">Apply to all</button>
      <div class="ack" id="ackLine">${S.ack ? "✓ EA applied: " + esc(S.ack.applied) + " · " + ago(S.ack.ts) : ""}</div>
    </div>
    <div class="lbl" style="margin:8px 0 0">By currency</div>`;
  if (!keys.length) h += `<div class="card empty">Waiting for the bots to report their currencies…</div>`;
  keys.forEach(k => h += symCard(k));
  h += `<div class="foot">Stop = no new trades; open trades keep their SL/TP.<br>Gold manual SL/TP is in USD price distance (e.g. SL 5 = $5).<br>Weekly stop follows the account limits above.</div>`;
  $("pCtl").innerHTML = h;
  // all-currency actions
  const mo0 = (() => { const v = keys.map(k => (S.control.sym && S.control.sym[k] && S.control.sym[k].maxOpen) || (S.symbols[k].cfg && S.symbols[k].cfg.maxOpen) || 1); return v.length && v.every(x => x === v[0]) ? v[0] : 1; })();
  segInit("aMO", mo0);
  $("stopAll").onclick = () => confirm("Stop ALL currencies? No new trades; open trades keep their SL/TP.") && send({ pause: true }, "Stop all");
  $("startAll").onclick = () => send({ pause: false }, "Start all");
  $("resetAll").onclick = () => confirm("Reset the daily/weekly loss stop on ALL currencies? Trading can resume today.") && send({ resetAll: nowS() }, "Reset all");
  $("closeAll").onclick = () => confirm("Close ALL open S4 trades now? This cannot be undone.") && send({ closeAll: nowS() }, "Close all");
  $("applyAll").onclick = () => {
    const d = +$("aDaily").value, w = +$("aWeekly").value, m = Math.round(+$("aMax").value), r = +$("aRisk").value, mo = +segVal("aMO");
    if (!(d >= 1 && d <= 50) || !(w >= 1 && w <= 50)) return alert("Daily and weekly stop must be 1–50%.");
    if (!(m >= 1 && m <= 20)) return alert("Max open (all) must be 1–20.");
    if (!(r >= 0.1 && r <= 10)) return alert("Risk per trade must be 0.1–10%.");
    if (!confirm(`Apply to the whole account?\nDaily stop ${d}% · Weekly stop ${w}% · Max open ${m}\nEvery currency: risk ${r}% per trade, max ${mo} open`)) return;
    const u = { dailyPct: d, weeklyPct: w, maxOpenAll: m, riskPct: r };
    keys.forEach(k => { u[`sym/${k}/risk`] = r; u[`sym/${k}/maxOpen`] = mo; });
    send(u, "Apply to all", true);
  };
  keys.forEach(k => wireSym(k));
}
function symCfg(k) { const c = (S.control.sym && S.control.sym[k]) || {}, e = (S.symbols[k] && S.symbols[k].cfg) || {}; return { ...e, ...c }; }
function symCard(k) {
  const sy = S.symbols[k] || {}, c = symCfg(k), open = S.ctlOpen === k, unit = (sy.cfg && sy.cfg.unit) || (k.includes("XAU") ? "USD" : "pips");
  const sub = `${esc(sy.strategy || "")} · ${openCount(k)} open`;
  const sum = `${c.lotMode === "manual" ? "Manual " + (c.lot ?? "") + " lot" : "Auto " + (c.risk ?? "-") + "%"} · max ${c.maxOpen || 1} · SL/TP ${c.sltpMode === "manual" ? "manual" : "auto"}`;
  if (!open) return `<div class="card"><button class="rowh" data-open="${esc(k)}"><span><b>${esc(k)}</b><div class="sub" style="font-weight:400">${sum}</div></span><span style="display:flex;align-items:center;gap:8px"><span data-badge="${esc(k)}">${statusBadge(sy)}</span><span class="sub">›</span></span></button></div>`;
  return `<div class="card stack" style="gap:12px" id="sc_${esc(k)}">
    <button class="rowh" data-open=""><span><span style="font-size:17px;font-weight:700">${esc(k)}</span><div class="sub" style="font-weight:400">${sub}</div></span><span data-badge="${esc(k)}">${statusBadge(sy)}</span></button>
    <div class="g2"><button class="btn red" data-stop="${esc(k)}">${c.stop ? "▶ Start " : "■ Stop "}${esc(k)}</button><button class="btn" data-reset="${esc(k)}">↺ Reset stop</button></div>
    <div class="fl">Lot size<div class="seg" id="lm_${esc(k)}"><button data-v="auto">Auto (risk %)</button><button data-v="manual">Manual lot</button></div></div>
    <div class="g2" id="lotAuto_${esc(k)}"><label class="fl">Risk per trade %<input id="rk_${esc(k)}" type="number" inputmode="decimal" step="0.1" value="${c.risk ?? ""}"></label><label class="fl">Max lot (cap, 0 = none)<input id="cp_${esc(k)}" type="number" inputmode="decimal" step="0.01" value="${c.cap ?? 0}"></label></div>
    <div class="g2" id="lotMan_${esc(k)}"><label class="fl">Fixed lot per trade<input id="lt_${esc(k)}" type="number" inputmode="decimal" step="0.01" value="${c.lot ?? 0.01}"></label><label class="fl">Max lot (cap, 0 = none)<input id="cp2_${esc(k)}" type="number" inputmode="decimal" step="0.01" value="${c.cap ?? 0}"></label></div>
    <div class="fl">Max open trades<div class="seg" id="mo_${esc(k)}">${[1,2,3].map(n => `<button data-v="${n}">${n}</button>`).join("")}</div></div>
    <div class="fl">Stop loss / take profit<div class="seg" id="sm_${esc(k)}"><button data-v="auto">Auto (ATR)</button><button data-v="manual">Manual size</button></div></div>
    <div class="tile sub" id="slAuto_${esc(k)}">Auto: SL ${(sy.cfg && sy.cfg.slAuto) || 1.5} × ATR(M5) · TP ${(sy.cfg && sy.cfg.rrAuto) || 1.5} × SL</div>
    <div class="g2" id="slMan_${esc(k)}"><label class="fl">SL (${unit})<input id="sl_${esc(k)}" type="number" inputmode="decimal" step="0.1" value="${c.sl || ""}"></label><label class="fl">TP (${unit})<input id="tp_${esc(k)}" type="number" inputmode="decimal" step="0.1" value="${c.tp || ""}"></label></div>
    <button class="pri" data-save="${esc(k)}">Save ${esc(k)}</button>
  </div>`;
}
function wireSym(k) {
  document.querySelectorAll(`[data-open]`).forEach(b => b.onclick = () => { S.ctlOpen = b.dataset.open || "__none"; S.ctlDirty = true; renderCtl(); });
  if (S.ctlOpen !== k) return;
  const c = symCfg(k), sy = S.symbols[k] || {};
  segInit("lm_" + k, c.lotMode === "manual" ? "manual" : "auto", v => { show("lotAuto_" + k, v === "auto"); show("lotMan_" + k, v === "manual"); });
  segInit("mo_" + k, c.maxOpen || 1);
  segInit("sm_" + k, c.sltpMode === "manual" ? "manual" : "auto", v => { show("slAuto_" + k, v === "auto"); show("slMan_" + k, v === "manual"); });
  document.querySelector(`[data-stop="${CSS.escape(k)}"]`).onclick = () => {
    const stop = !symCfg(k).stop;
    if (stop && !confirm(`Stop ${k}? No new ${k} trades; open trades keep their SL/TP.`)) return;
    send({ [`sym/${k}/stop`]: stop }, (stop ? "Stop " : "Start ") + k, true);
  };
  document.querySelector(`[data-reset="${CSS.escape(k)}"]`).onclick = () => confirm(`Reset the daily/weekly loss stop for ${k}?`) && send({ [`sym/${k}/reset`]: nowS() }, "Reset " + k);
  document.querySelector(`[data-save="${CSS.escape(k)}"]`).onclick = () => {
    const lm = segVal("lm_" + k), sm = segVal("sm_" + k), mo = +segVal("mo_" + k);
    const risk = +$("rk_" + k).value, lot = +$("lt_" + k).value, cap = +(lm === "manual" ? $("cp2_" + k).value : $("cp_" + k).value) || 0;
    const sl = +$("sl_" + k).value, tp = +$("tp_" + k).value;
    if (lm === "auto" && !(risk >= 0.1 && risk <= 10)) return alert("Risk per trade must be 0.1–10%.");
    if (lm === "manual" && !(lot > 0 && lot <= 50)) return alert("Enter a fixed lot above 0.");
    if (!(cap >= 0)) return alert("Max lot must be 0 or more.");
    if (sm === "manual" && !(sl > 0 && tp > 0)) return alert("Enter both SL and TP sizes above 0.");
    const unit = (sy.cfg && sy.cfg.unit) || "pips";
    const msg = `Save ${k}?\nLot: ${lm === "manual" ? lot + " fixed" : risk + "% risk"}${cap > 0 ? " (max " + cap + ")" : ""}\nMax open: ${mo}\nSL/TP: ${sm === "manual" ? `SL ${sl} / TP ${tp} ${unit}` : "auto (ATR)"}`;
    if (!confirm(msg)) return;
    const u = {}; const p = `sym/${k}/`;
    Object.assign(u, { [p + "lotMode"]: lm, [p + "maxOpen"]: mo, [p + "sltpMode"]: sm, [p + "cap"]: cap });
    if (lm === "auto") u[p + "risk"] = risk; else u[p + "lot"] = lot;
    if (sm === "manual") { u[p + "sl"] = sl; u[p + "tp"] = tp; }
    send(u, "Save " + k, true);
  };
}
function segInit(id, val, onChange) {
  const el = $(id); if (!el) return;
  const set = v => { el.querySelectorAll("button").forEach(b => b.classList.toggle("on", String(b.dataset.v) === String(v))); el.dataset.val = v; onChange && onChange(String(v)); };
  el.querySelectorAll("button").forEach(b => b.onclick = () => set(b.dataset.v));
  set(val);
}
const segVal = id => $(id).dataset.val;
function send(obj, what, rerender) {
  const line = $("ackLine");
  if (line) line.textContent = what + ": sending…";
  update(ref(db, S.base + "/control"), obj)
    .then(() => { if ($("ackLine")) $("ackLine").textContent = what + ": sent. Waiting for the EA…"; if (rerender) { S.ctlDirty = true; setTimeout(renderCtl, 50); } })
    .catch(e => { if ($("ackLine")) $("ackLine").textContent = "Not sent: " + e.message; alert("Not sent: " + e.message); });
}
function updCtlBadges() {
  document.querySelectorAll("[data-badge]").forEach(el => el.innerHTML = statusBadge(S.symbols[el.dataset.badge]));
  const a = S.account || {}, el = $("allBadge");
  if (el) el.innerHTML = a.paused ? '<span class="wn">■ STOPPED</span>' : '<span class="up">● RUNNING</span>';
}

/* ---------- CSV ---------- */
function exportCsv(list, name) {
  const head = ["close_time_myt","open_time_myt","symbol","strategy","side","lots","entry","exit","profit_usd","result","close_reason","hold_minutes"];
  const d = t => { const p = mytParts(t); return `${p.y}-${String(p.m + 1).padStart(2,"0")}-${String(p.d).padStart(2,"0")} ${String(p.h).padStart(2,"0")}:${String(p.mi).padStart(2,"0")}`; };
  const q = v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const rows = list.map(t => [d(t.t), t.o ? d(t.o) : "", t.sym, t.strategy, t.dir, t.lots, t.entry, t.exit, Number(t.profit).toFixed(2), t.profit > 0 ? "win" : "loss", t.reason, t.o ? Math.round((t.t - t.o) / 60) : ""].map(q).join(","));
  const csv = head.join(",") + "\n" + rows.join("\n");
  if (!list.length) return alert("No trades in this period to export.");
  const file = new File([csv], name, { type: "text/csv" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) { navigator.share({ files: [file], title: name }).catch(() => {}); return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
boot();
</script>
</body>
